<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teachers</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>Teachers</h1>

<a th:href="@{/teachers/showAddTeacherForm}">Add Teacher</a>

<table>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Age</th>
        <th>Main Subject</th>
        <th>Salary</th>
    </tr>

    <tbody>
        <tr th:each="tempTeacher : ${teachers}">
            <td th:text="${tempTeacher.teacherId}"></td>
            <td th:text="${tempTeacher.firstName}"></td>
            <td th:text="${tempTeacher.lastName}"></td>
            <td th:text="${tempTeacher.email}"></td>
            <td th:text="${tempTeacher.age}"></td>
            <td th:text="${tempTeacher.mainSubject}"></td>
            <td th:text="${tempTeacher.salary}"></td>

        </tr>
    </tbody>


</table>

</body>
</html>
